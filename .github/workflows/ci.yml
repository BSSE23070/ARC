name: CI

# Runs on every push to every branch, so a pull request shows the results for
# its latest commit. main is expected to stay green.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc -d arc_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ARC_TEST_DATABASE_URL: postgresql+asyncpg://arc:arc@localhost:5432/arc_test
      ARC_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy arc
      - name: Module boundaries
        run: lint-imports
      - name: Tests (real PostgreSQL and Redis)
        run: pytest --cov=arc --cov-report=term-missing
      - name: Migrations match the models
        run: alembic check
        env:
          ARC_DATABASE_URL: ${{ env.ARC_TEST_DATABASE_URL }}
      - name: Committed OpenAPI spec is up to date
        run: |
          python -m arc.export_openapi /tmp/openapi.json
          diff -u ../packages/api-client/openapi.json /tmp/openapi.json \
            || (echo "::error::Run: cd backend && python -m arc.export_openapi ../packages/api-client/openapi.json && npm run api:generate" && exit 1)
      - name: Docker image builds
        run: docker build -t arc-api .

  mobile:
    name: App (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files are up to date (design tokens, API types)
        run: |
          npm run tokens
          npm run api:generate
          git diff --exit-code -- packages/tokens/src packages/api-client/src \
            || (echo "::error::Generated files are stale. Run: npm run tokens && npm run api:generate, then commit." && exit 1)
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: arc-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
