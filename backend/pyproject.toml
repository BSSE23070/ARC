[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-backend"
version = "0.1.0"
description = "Arc API: modular monolith (FastAPI, PostgreSQL, Redis)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "aiosmtplib>=3.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "aiosmtpd>=1.4",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
  "B008",   # FastAPI's Depends() in argument defaults is the documented pattern
  "S105",   # false positives on names like "token_type"
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]
"arc/modules/identity/emails.py" = ["E501"]  # email copy reads better unwrapped
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["aiosmtplib.*", "argon2.*"]
ignore_missing_imports = true

# Module boundaries, enforced in CI. Add each new domain module to the
# "independence" contract so modules can only talk through arc.core.
[tool.importlinter]
root_package = "arc"

[[tool.importlinter.contracts]]
name = "core never imports domain modules"
type = "forbidden"
source_modules = ["arc.core"]
forbidden_modules = ["arc.modules"]
